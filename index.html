const fmt = (n, cur) =>
  cur === "CZK"

function uuid() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (ch) => {
    const r = (Math.random() * 16) | 0;
    return (ch === "x" ? r : (r & 0x3) | 0x8).toString(16);
  });
}

/* deterministic QR-looking grid */
function pseudoQR(seed, size = 25) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) h = (h ^ seed.charCodeAt(i)) * 16777619;
  const rnd = () => {
    h ^= h << 13;
    h ^= h >>> 17;
    h ^= h << 5;
    return (h >>> 0) / 4294967296;
  };
  const g = [];
  for (let y = 0; y < size; y++) {
    const row = [];
    for (let x = 0; x < size; x++) row.push(rnd() > 0.52);
    g.push(row);
  }
  const finder = (oy, ox) => {
    for (let y = 0; y < 7; y++)
      for (let x = 0; x < 7; x++) {
        const b = y === 0 || y === 6 || x === 0 || x === 6;
        const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
        g[oy + y][ox + x] = b || core;
      }
    for (let y = -1; y <= 7; y++)
      for (let x = -1; x <= 7; x++)
        if (y === -1 || y === 7 || x === -1 || x === 7)
          if (g[oy + y] && ox + x >= 0 && ox + x < size) g[oy + y][ox + x] = false;
  };
  finder(0, 0);
  finder(0, size - 7);
  finder(size - 7, 0);
  return g;
}
function QR({ seed }) {
  const size = 25,
    cell = 6;
  const grid = useMemo(() => pseudoQR(seed, size), [seed]);
  return (
    <svg
      width={size * cell}
      height={size * cell}
      style={{ background: "#fff", borderRadius: 10, padding: 8, boxSizing: "content-box", border: `1px solid ${t.border}` }}
    >
      {grid.flatMap((row, y) =>
        row.map((on, x) =>
          on ? <rect key={`${x}-${y}`} x={x * cell} y={y * cell} width={cell} height={cell} fill={t.ink} /> : null
        )
      )}
    </svg>
  );
}

}

/* =================================================================== */
export default function App() {
  const [region, setRegion] = useState("EUROPE");
  const [kyc, setKyc] = useState("BASIC");
  const [hasAccount, setHasAccount] = useState(true);
  const [limitOk, setLimitOk] = useState(true);
  const [beCheckOk, setBeCheckOk] = useState(true);

  const [step, setStep] = useState(1);
  const [beError, setBeError] = useState(false);
  const allowed = region === "GLOBAL" ? ["USDC", "USDT"] : ["EUR", "CZK", "USDC", "USDT"];
  const [currency, setCurrency] = useState(allowed[0]);
  const [amount, setAmount] = useState("");
  const [periods, setPeriods] = useState({});
  const [selectedAccount, setSelectedAccount] = useState(false);
  const [legal, setLegal] = useState(false);
  const [paymentConfirmed, setPaymentConfirmed] = useState(false);
  const [ticket, setTicket] = useState(null);
  const [done, setDone] = useState(false);
  const [cancelled, setCancelled] = useState(false);

  useEffect(() => {
    if (!allowed.includes(currency)) setCurrency(allowed[0]);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [region]);

  const min = CONFIG.minInvestTicket[currency];
  const amountValid = parseFloat(amount || "0") >= min;
  const anyPeriod = Object.keys(periods).length > 0;
  const { min: rMin, max: rMax } = CONFIG.interestBounds;
  const ratesValid = Object.values(periods).every((r) => {
    const n = parseFloat(r);
    return !isNaN(n) && n >= rMin && n <= rMax;
  });
  const step1Valid = amountValid && anyPeriod && ratesValid;
  const showFunds = step === 4 || done;

  const reset = () => {
    setStep(1);
    setBeError(false);
    setAmount("");
    setPeriods({});
    setSelectedAccount(false);
    setLegal(false);
    setPaymentConfirmed(false);
    setTicket(null);
    setDone(false);
    setCancelled(false);
  };
  const togglePeriod = (m, rate) =>
    setPeriods((p) => {
      const n = { ...p };
      if (n[m] !== undefined) delete n[m];
      else n[m] = rate;
      return n;
    });
  const setRate = (m, val) => setPeriods((p) => ({ ...p, [m]: val }));
  const createTicket = () => {
    const bePass = beCheckOk && limitOk && hasAccount && anyPeriod;
    if (!bePass) {
      setBeError(true);
      setStep(1);
      return;
    }
    setTicket({ id: uuid(), status: "PENDING_SETUP", stage: "FUNDS_TRANSFER" });
    setStep(4);
  };
  const paymentId = ticket ? ticket.id.slice(0, 8) : "";
  const back = step === 2 || step === 3;

  return (
    <div style={{ fontFamily: ui, color: t.ink, background: "#eef1f4", minHeight: "100vh" }}>
      

      {/* prototype controls strip (not part of product) */}
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          gap: 18,
          alignItems: "center",
          padding: "10px 18px",
          borderBottom: `1px dashed ${t.midBlue}`,
          background: "#fafbfc",
          fontSize: 12,
        }}
      >
        <span style={{ fontFamily: jakarta, fontWeight: 700, fontSize: 11, letterSpacing: 0.3, color: t.midBlue }}>
          PROTOTYPE CONTROLS
        </span>
        <Toggle label="Region" value={region} onChange={setRegion} options={[["EUROPE", "EU/ZERO"], ["GLOBAL", "Global"]]} />
        <Toggle label="KYC" value={kyc} onChange={setKyc} options={[["BASIC", "≥ Basic"], ["NONE", "Below"]]} />
        <Toggle label="Account" value={hasAccount ? "Y" : "N"} onChange={(v) => setHasAccount(v === "Y")} options={[["Y", "Has"], ["N", "None"]]} />
        <Toggle label="Limit" value={limitOk ? "OK" : "FAIL"} onChange={(v) => setLimitOk(v === "OK")} options={[["OK", "OK"], ["FAIL", "Exceeded"]]} />
        <Toggle label="BE re-check" value={beCheckOk ? "OK" : "FAIL"} onChange={(v) => setBeCheckOk(v === "OK")} options={[["OK", "Pass"], ["FAIL", "Fail"]]} />
        <button onClick={reset} style={{ marginLeft: "auto", fontFamily: ui, fontSize: 12, color: t.midBlue, background: "none", border: "none", cursor: "pointer", textDecorationLine: "underline" }}>
          Restart
        </button>
        {ticket && (
          <span
            style={{
              fontFamily: ui,
              fontSize: 11.5,
              padding: "4px 10px",
              borderRadius: 999,
              background: cancelled ? t.redSoft : t.okBg,
              color: cancelled ? t.red : t.ok,
            }}
          >
            ticket {ticket.id.slice(0, 8)} · {cancelled ? "CANCELLED" : `${ticket.status} / ${ticket.stage}`}
          </span>
        )}
      </div>

      {/* app frame */}
      <div style={{ display: "flex", background: t.white, minHeight: 700 }}>
        <Sidebar />
        <div style={{ width: 1, background: t.border }} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 24px 48px" }}>
          <div style={{ width: "100%", maxWidth: 543 }}>
            <Stepper step={showFunds ? 4 : step} done={done || cancelled} />

            {/* header */}
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "center", position: "relative", margin: "8px 0 20px" }}>
              {back ? (
                <button
                  onClick={() => setStep(step - 1)}
                  style={{ position: "absolute", left: 0, top: 0, width: 32, height: 32, borderRadius: 200, border: "none", background: t.lightGrey, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
                >
                  <ChevronLeft size={20} color={t.ink} />
                </button>
              ) : null}
              <div style={{ textAlign: "center" }}>
                <div style={{ fontFamily: ui, fontWeight: 600, fontSize: 20, lineHeight: "24px", color: t.ink }}>
                  {HEAD[showFunds ? 4 : step].title}
                </div>
                <div style={{ fontFamily: ui, fontWeight: 400, fontSize: 14, lineHeight: "18px", color: t.midBlue, marginTop: 4 }}>
                  {HEAD[showFunds ? 4 : step].sub}
                </div>
              </div>
            </div>

            {cancelled ? (
              <Card><Terminal kind="cancel" ticket={ticket} onRestart={reset} /></Card>
            ) : done ? (
              <Card><Terminal kind="done" ticket={ticket} onRestart={reset} /></Card>
            ) : step === 1 ? (
              <Step1 {...{ currency, setCurrency, allowed, amount, setAmount, min, amountValid, periods, togglePeriod, setRate, rMin, rMax, beError, step1Valid, onContinue: () => { setBeError(false); setStep(2); } }} />
            ) : step === 2 ? (
              <Step2 {...{ kyc, hasAccount, currency, selectedAccount, setSelectedAccount, onContinue: () => setStep(3) }} />
            ) : step === 3 ? (
              <Step3 {...{ currency, amount, periods, legal, setLegal, limitOk, onContinue: createTicket }} />
            ) : (
              <Step4 {...{ currency, amount, ticket, paymentId, paymentConfirmed, setPaymentConfirmed, onConfirm: () => { setTicket((x) => ({ ...x, stage: "FUNDS_CONFIRMATION" })); setDone(true); }, onCancel: () => setCancelled(true) }} />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const HEAD = {
  1: { title: "Set up your investment", sub: "Choose a currency, amount and terms." },
  2: { title: "Choose a payment method", sub: "Select the account you'll invest from." },
  3: { title: "Review & confirm", sub: "Check everything before you commit." },
  4: { title: "Transfer your funds", sub: "Send your deposit to activate the ticket." },
};

/* ---------- stepper ---------- */
function Stepper({ step, done }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, minHeight: 24 }}>
      {STEPS.map((label, i) => {
        const n = i + 1;
        const state = done || n < step ? "done" : n === step ? "active" : "todo";
        const filled = state === "done" || state === "active";
        return (
          <React.Fragment key={label}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 24, height: 24, borderRadius: 200, background: filled ? t.slate : t.grey40, display: "flex", alignItems: "center", justifyContent: "center" }}>
                {state === "done" ? (
                  <Check size={13} color="#fff" strokeWidth={3} />
                ) : (
                  <span style={{ fontFamily: jakarta, fontWeight: 700, fontSize: 12, color: filled ? "#fff" : t.ink }}>{n}</span>
                )}
              </div>
              <span style={{ fontFamily: jakarta, fontWeight: 500, fontSize: 13, letterSpacing: -0.1, color: state === "active" ? t.ink : t.midBlue }}>
                {label}
              </span>
            </div>
            {i < STEPS.length - 1 && <div style={{ width: 28, height: 1, background: t.dividerLight }} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

/* ---------- Step 1 ---------- */
function Step1({ currency, setCurrency, allowed, amount, setAmount, min, amountValid, periods, togglePeriod, setRate, rMin, rMax, beError, step1Valid, onContinue }) {
  return (
    <Card>
      {beError && (
        <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: t.redSoft, border: `1px solid ${t.red}`, borderRadius: 12, padding: "12px 14px", marginBottom: 20 }}>
          <AlertTriangle size={18} color={t.red} style={{ flexShrink: 0, marginTop: 1 }} />
          <span style={{ fontFamily: ui, fontSize: 13, color: t.ink }}>
            Something changed since you started, so we couldn’t set up your ticket. Review your configuration and try again.
          </span>
        </div>
      )}

      <div style={{ marginBottom: 18 }}>
        <FieldLabel>Currency</FieldLabel>
        <div style={{ position: "relative" }}>
          <select value={currency} onChange={(e) => setCurrency(e.target.value)} style={{ ...inputStyle, appearance: "none", paddingRight: 40 }}>
            {allowed.map((cur) => (
              <option key={cur} value={cur}>{cur} — {CURRENCY_LABEL[cur]}</option>
            ))}
          </select>
          <ChevronDown size={18} color={t.midBlue} style={{ position: "absolute", right: 14, top: 13, pointerEvents: "none" }} />
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <FieldLabel>Amount to invest</FieldLabel>
        <input
          type="number"
          value={amount}
          placeholder={`e.g. ${min}`}
          onChange={(e) => setAmount(e.target.value)}
          style={{ ...inputStyle, borderColor: amount && !amountValid ? t.red : t.border }}
        />
        <div style={{ fontFamily: ui, fontSize: 12, color: amount && !amountValid ? t.red : t.midBlue, marginTop: 6 }}>
          Minimum ticket: {fmt(min, currency)}
        </div>
      </div>

      <SectionTitle sub={`Select one or more. Interest rates are per year (${rMin}–${rMax}%).`}>Choose your terms</SectionTitle>
      <div style={{ display: "flex", gap: 4, padding: 2, border: `1px solid ${t.border}`, borderRadius: 12, boxShadow: shadowXs, marginBottom: 24 }}>
        {CONFIG.availablePeriods.map((p) => {
          const on = periods[p.months] !== undefined;
          const rate = on ? parseFloat(periods[p.months]) : p.defaultRate;
          const oob = on && (isNaN(rate) || rate < rMin || rate > rMax);
          return (
            <div
              key={p.months}
              onClick={() => togglePeriod(p.months, p.defaultRate)}
              style={{
                flex: 1,
                height: 64,
                borderRadius: 10,
                border: on ? `1.5px solid ${oob ? t.red : t.red}` : "1.5px solid transparent",
                background: t.white,
                padding: 10,
                display: "flex",
                flexDirection: "column",
                justifyContent: "center",
                gap: 4,
                cursor: "pointer",
              }}
            >
              <span style={{ fontFamily: ui, fontWeight: 500, fontSize: 13, color: on ? t.red : t.ink }}>{p.months}m</span>
              {on ? (
                <div style={{ display: "flex", alignItems: "baseline", gap: 2 }} onClick={(e) => e.stopPropagation()}>
                  <input
                    type="number"
                    value={periods[p.months]}
                    onChange={(e) => setRate(p.months, e.target.value)}
                    style={{ width: 34, border: "none", borderBottom: `1px solid ${oob ? t.red : t.red}`, background: "transparent", color: t.red, fontFamily: ui, fontWeight: 500, fontSize: 13, padding: 0, textAlign: "left" }}
                  />
                  <span style={{ color: t.red, fontFamily: ui, fontSize: 13 }}>%</span>
                </div>
              ) : (
                <span style={{ fontFamily: ui, fontWeight: 400, fontSize: 13, color: t.midBlue }}>{p.defaultRate}%</span>
              )}
            </div>
          );
        })}
      </div>

      <PrimaryButton onClick={onContinue} disabled={!step1Valid}>Continue</PrimaryButton>
    </Card>
  );
}

/* ---------- Step 2 ---------- */
function Step2({ kyc, hasAccount, currency, selectedAccount, setSelectedAccount, onContinue }) {
  const acct = ACCOUNTS[currency];
  let body;
  if (kyc === "NONE") {
    body = <LinkAction icon={ShieldAlert} note="Opens Account tiers to verify your account.">Please verify your account.</LinkAction>;
  } else if (!hasAccount) {
    body = <LinkAction icon={CreditCard} note="Opens Payment information to add an account.">Please add a payment information to continue</LinkAction>;
  } else {
    body = (
      <div
        onClick={() => setSelectedAccount((s) => !s)}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 14,
          border: `1.5px solid ${selectedAccount ? t.red : t.border}`,
          background: t.white,
          boxShadow: shadowXs,
          borderRadius: 16,
          padding: "16px 20px",
          cursor: "pointer",
        }}
      >
        <Wallet size={22} color={selectedAccount ? t.red : t.midBlue} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: ui, fontWeight: 500, fontSize: 14, color: t.ink }}>{acct.label}</div>
          <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 12, color: t.midBlue }}>{acct.number}</div>
        </div>
        <div style={{ width: 22, height: 22, borderRadius: 999, border: `2px solid ${selectedAccount ? t.red : t.grey40}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {selectedAccount && <div style={{ width: 11, height: 11, borderRadius: 999, background: t.red }} />}
        </div>
      </div>
    );
  }
  const canContinue = kyc !== "NONE" && hasAccount && selectedAccount;
  return (
    <Card>
      <div style={{ fontFamily: ui, fontSize: 13, color: t.midBlue, marginBottom: 14 }}>Your active {currency} accounts</div>
      {body}
      <div style={{ marginTop: 24 }}>
        <PrimaryButton onClick={onContinue} disabled={!canContinue}>Continue</PrimaryButton>
      </div>
    </Card>
  );
}

/* ---------- Step 3 ---------- */
function Step3({ currency, amount, periods, legal, setLegal, limitOk, onContinue }) {
  const acct = ACCOUNTS[currency];
  const canContinue = legal && limitOk;
  return (
    <Card>
      <div style={{ background: t.grey15, border: `1px solid ${t.border}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
        <SummaryRow k="Amount" v={fmt(amount, currency)} />
        <SummaryRow k="Currency" v={`${currency} — ${CURRENCY_LABEL[currency]}`} />
        {Object.entries(periods).map(([m, r]) => (
          <SummaryRow key={m} k={`${m} months`} v={`${r}% p.a.`} />
        ))}
        <SummaryRow k="Financial account" v={acct.label} />
        <SummaryRow k="Investor fee" v={`${(CONFIG.investorFeeRate * 100).toFixed(1)}%`} />
      </div>

      {!limitOk && (
        <div style={{ marginBottom: 16 }}>
          <LinkAction icon={AlertTriangle} note="Opens Account tiers to raise your limits.">Please increase your limits to continue.</LinkAction>
        </div>
      )}

      <label style={{ display: "flex", gap: 12, alignItems: "flex-start", marginBottom: 22, cursor: "pointer" }}>
        <input type="checkbox" checked={legal} onChange={(e) => setLegal(e.target.checked)} style={{ width: 18, height: 18, marginTop: 1, accentColor: t.red }} />
        <span style={{ fontFamily: ui, fontSize: 13, lineHeight: "18px", color: t.ink }}>
          I have read and agree to the investment terms and framework agreement, and understand the risks of auto-investing.
        </span>
      </label>

      <PrimaryButton onClick={onContinue} disabled={!canContinue}>Continue</PrimaryButton>
    </Card>
  );
}

/* ---------- Step 4 ---------- */
function Step4({ currency, amount, ticket, paymentId, paymentConfirmed, setPaymentConfirmed, onConfirm, onCancel }) {
  const acct = ACCOUNTS[currency];
  const faId = CONFIG.financialAccountIds[currency];
  const isCrypto = currency === "USDC" || currency === "USDT";
  const seed = `${ticket?.id}|${currency}|${amount}`;
  return (
    <Card>
      <div style={{ fontFamily: ui, fontSize: 13, color: t.midBlue, marginBottom: 16 }}>
        Send {fmt(amount, currency)} to {CONFIG.instantUser} using the details below.
      </div>
      <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ flex: "1 1 260px", minWidth: 240 }}>
          <SummaryRow k="Recipient" v={CONFIG.instantUser} />
          {isCrypto ? (
            <>
              <SummaryRow k="Network" v={currency === "USDC" ? "Ethereum (ERC-20)" : "Tron (TRC-20)"} />
              <SummaryRow k="Wallet address" v={acct.number} mono />
              <SummaryRow k="Amount" v={fmt(amount, currency)} />
            </>
          ) : currency === "EUR" ? (
            <>
              <SummaryRow k="IBAN" v={acct.number} mono />
              <SummaryRow k="BIC / SWIFT" v="GIBACZPX" mono />
              <SummaryRow k="Amount" v={fmt(amount, currency)} />
              <SummaryRow k="Payment reference" v={paymentId} mono />
            </>
          ) : (
            <>
              <SummaryRow k="Account number" v="1920001453/0800" mono />
              <SummaryRow k="Amount" v={fmt(amount, currency)} />
              <SummaryRow k="Variable symbol" v={paymentId} mono />
            </>
          )}
          <SummaryRow k="Your account" v={acct.label} />
          <SummaryRow k="Financial account ID" v={`${faId.slice(0, 8)}…`} mono />
        </div>
        <div style={{ textAlign: "center" }}>
          <QR seed={seed} />
          <div style={{ fontFamily: ui, fontSize: 11, color: t.midBlue, marginTop: 6 }}>Scan to pay{!isCrypto && " (SPD)"}</div>
        </div>
      </div>

      <label style={{ display: "flex", gap: 12, alignItems: "center", margin: "22px 0 20px", cursor: "pointer" }}>
        <input type="checkbox" checked={paymentConfirmed} onChange={(e) => setPaymentConfirmed(e.target.checked)} style={{ width: 18, height: 18, accentColor: t.red }} />
        <span style={{ fontFamily: ui, fontSize: 14, color: t.ink }}>I confirm the payment</span>
      </label>

      <div style={{ display: "flex", gap: 12 }}>
        <GhostButton danger onClick={onCancel}><X size={16} /> Cancel order</GhostButton>
        <div style={{ flex: 1 }}>
          <PrimaryButton onClick={onConfirm} disabled={!paymentConfirmed}>Confirm deposit</PrimaryButton>
        </div>
      </div>
    </Card>
  );
}

/* ---------- terminal ---------- */
function Terminal({ kind, ticket, onRestart }) {
  const ok = kind === "done";
  return (
    <div style={{ textAlign: "center", padding: "12px 0" }}>
      <div style={{ width: 56, height: 56, borderRadius: 999, background: ok ? t.okBg : t.redSoft, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
        {ok ? <Check size={28} color={t.ok} /> : <X size={28} color={t.red} />}
      </div>
      <div style={{ fontFamily: ui, fontWeight: 600, fontSize: 20, color: t.ink, marginBottom: 8 }}>
        {ok ? "Payment confirmed" : "Order cancelled"}
      </div>
      <div style={{ fontFamily: ui, fontSize: 14, color: t.midBlue, maxWidth: 380, margin: "0 auto 18px" }}>
        {ok
          ? "We’ll match your deposit and activate your auto-invest ticket."
          : "The invest ticket was set to CANCELLED. No funds were moved."}
      </div>
      <div style={{ display: "inline-block", background: ok ? t.okBg : t.redSoft, color: ok ? t.ok : t.red, borderRadius: 999, padding: "8px 16px", fontFamily: ui, fontSize: 12.5, marginBottom: 20 }}>
        Ticket {ticket.id.slice(0, 8)} {ok ? "· stage FUNDS_CONFIRMATION" : "· CANCELLED"}
      </div>
      <div style={{ display: "flex", justifyContent: "center" }}>
        <GhostButton onClick={onRestart}>Start another</GhostButton>
      </div>
    </div>
  );
}

/* ---------- controls toggle ---------- */
function Toggle({ label, value, options, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <span style={{ fontFamily: ui, fontSize: 11.5, color: t.midBlue }}>{label}</span>
      <div style={{ display: "flex", background: "#e9edf1", borderRadius: 7, padding: 2 }}>
        {options.map(([val, lab]) => (
          <button
            key={val}
            onClick={() => onChange(val)}
            style={{
              padding: "4px 8px",
              borderRadius: 5,
              border: "none",
              fontFamily: ui,
              fontSize: 11.5,
              fontWeight: 500,
              cursor: "pointer",
              background: value === val ? "#fff" : "transparent",
              color: value === val ? t.ink : t.midBlue,
              boxShadow: value === val ? "0 1px 2px rgba(0,0,0,.08)" : "none",
            }}
          >
            {lab}
          </button>
        ))}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
